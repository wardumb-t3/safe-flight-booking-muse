[package]
name = "muse-vault-flight"
version = "0.9.1"
edition = "2021"
description = "Fork of Terminal-3/z-tenant-flight for muse-vault: adds hold-offer (pay later) and order-status, so a personal agent can hold a flight and the traveller pays on a checkout page"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
