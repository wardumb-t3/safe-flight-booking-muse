<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probe Result</title>
  <style>
    :root { --bg:#f7f7f5; --fg:#1b1b1b; --ok:#0f6e63; --bad:#a3302a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --ok:#4fc2b2; --bad:#ef7d74; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    main { max-width:560px; margin:0 auto; padding:24px 16px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
  </style>
</head>
<body>
<main>
  <h1 id="h">Result</h1>
  <p><a href="/">Back to the probe</a></p>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const status = p.get("status");
  const h = document.getElementById("h");
  h.textContent = status === "paid" ? "Stripe Checkout: payment complete (test mode)" : "Stripe Checkout: cancelled";
  h.className = status === "paid" ? "ok" : "bad";
  fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event: "result", detail: { status: "checkout_" + status } }) }).catch(() => {});
</script>
</body>
</html>
